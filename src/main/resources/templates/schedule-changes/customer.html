<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{scheduling/c-layout :: head('My Delivery Schedule')}"></head>
<body><header th:replace="~{shared/layout :: header}"></header>
<nav class="module-nav container" aria-label="Customer delivery"><a th:href="@{/schedule-changes}">My schedule</a><a th:href="@{/requests}">My requests</a></nav>
<main class="container narrow"><p class="eyebrow">CUSTOMER / DELIVERY</p><h1>My delivery schedule</h1><p class="alert success" th:if="${successMessage}" th:text="${successMessage}"></p><p class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<section><h2>Time change proposals</h2><p class="muted" th:if="${#lists.isEmpty(changes)}">No time change needs your decision.</p>
<article class="card" th:each="entry : ${changes}"><div><p class="eyebrow" th:text="${'REQUEST #' + entry.card().request().id()}"></p><h3 th:text="${entry.card().request().details().recipientName()}"></h3><p>Current: <span th:text="${entry.card().schedule().pickupAt()}"></span> – <span th:text="${entry.card().schedule().deliveryAt()}"></span></p><p>Proposed: <strong th:text="${entry.change().proposedPickupAt()}"></strong> – <strong th:text="${entry.change().proposedDeliveryAt()}"></strong></p><p>The current schedule stays active until you confirm.</p></div><form class="decision-form" method="post" th:action="@{/schedule-changes/{id}/decision(id=${entry.card().request().id()})}"><input type="hidden" name="changeId" th:value="${entry.change().id()}"><input type="hidden" name="version" th:value="${entry.change().version()}"><button type="submit" name="accept" value="true">Confirm new time</button><button type="submit" name="accept" value="false" class="secondary">Decline</button></form></article></section>
<section><h2>Confirmed deliveries</h2><p class="muted" th:if="${#lists.isEmpty(customerSchedules)}">No delivery has been scheduled yet.</p><article class="card" th:each="item : ${customerSchedules}"><p class="eyebrow" th:text="${'REQUEST #' + item.request().id()}"></p><h3 th:text="${item.request().details().recipientName() + ' · ' + item.request().details().parcelDescription()}"></h3><p><strong th:text="${item.staffName()}"></strong> · <span th:text="${item.schedule().pickupAt()}"></span> – <span th:text="${item.schedule().deliveryAt()}"></span></p><a th:href="@{/tracking/{id}/events(id=${item.request().id()})}">View delivery progress</a></article></section>
</main></body></html>
