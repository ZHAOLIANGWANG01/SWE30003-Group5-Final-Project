<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Quotations')}"></head>
<body>
<header th:replace="~{shared/layout :: header}"></header>
<main class="container narrow">
  <p class="eyebrow">MEMBER B / QUOTATIONS</p>
  <h1>Quotes for Request #<span th:text="${request.id()}"></span></h1>
  <p th:if="${office}"><a class="button" th:href="@{/quotes/new(requestId=${request.id()})}">Issue a quote</a></p>
  <section class="card" th:each="q : ${quotes}">
    <h2>Quote #<span th:text="${q.id()}"></span></h2>
    <p>Amount: AUD <strong th:text="${q.amount()}"></strong></p>
    <p>Status: <span th:text="${q.status()}"></span></p>
    <a th:href="@{/quotes/{id}(id=${q.id()})}">View quote</a>
  </section>
  <p th:if="${#lists.isEmpty(quotes)}">No quote has been issued yet.</p>
  <a th:href="@{/requests/{id}(id=${request.id()})}">Back to request</a>
</main>
<footer th:replace="~{shared/layout :: footer}"></footer>
</body>
</html>
