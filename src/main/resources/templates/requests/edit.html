<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Edit Request')}"></head>
<body>
<header th:replace="~{shared/layout :: header}"></header>
<main class="container narrow">
  <p class="eyebrow">MEMBER B / REQUESTS</p>
  <h1>Edit Request #<span th:text="${request.id()}"></span></h1>
  <p class="muted">Only unquoted requests can be changed. A stale version must be reviewed again.</p>
  <p class="alert error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
  <section class="card">
    <form class="stack" method="post" th:action="@{/requests/{id}/edit(id=${request.id()})}">
      <input type="hidden" name="version" th:value="${request.version()}">
      <label for="customerName">Customer name</label>
      <input id="customerName" name="customerName" maxlength="120" required th:value="${form['customerName']}">
      <label for="customerPhone">Customer phone</label>
      <input id="customerPhone" name="customerPhone" maxlength="40" required th:value="${form['customerPhone']}">
      <label for="pickupAddress">Pickup address</label>
      <input id="pickupAddress" name="pickupAddress" maxlength="500" required th:value="${form['pickupAddress']}">
      <label for="deliveryAddress">Delivery address</label>
      <input id="deliveryAddress" name="deliveryAddress" maxlength="500" required th:value="${form['deliveryAddress']}">
      <label for="recipientName">Recipient name</label>
      <input id="recipientName" name="recipientName" maxlength="120" required th:value="${form['recipientName']}">
      <label for="recipientPhone">Recipient phone</label>
      <input id="recipientPhone" name="recipientPhone" maxlength="40" required th:value="${form['recipientPhone']}">
      <label for="parcelDescription">Parcel description</label>
      <textarea id="parcelDescription" name="parcelDescription" rows="4" maxlength="1000" required
                th:text="${form['parcelDescription']}"></textarea>
      <label for="handlingNotes">Handling notes</label>
      <textarea id="handlingNotes" name="handlingNotes" rows="3" maxlength="2000"
                th:text="${form['handlingNotes']}"></textarea>
      <button type="submit">Save changes</button>
      <a th:href="@{/requests/{id}(id=${request.id()})}">Cancel editing</a>
    </form>
  </section>
</main>
<footer th:replace="~{shared/layout :: footer}"></footer>
</body>
</html>
