spring.application.name=group5-delivery
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DELIVERY_DB_URL:jdbc:h2:file:./data/delivery;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=5000}
spring.datasource.username=${DELIVERY_DB_USER:sa}
spring.datasource.password=${DELIVERY_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.h2.console.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.time-zone=Australia/Melbourne
spring.thymeleaf.cache=true
app.demo.enabled=${DELIVERY_DEMO_ENABLED:true}
app.demo.password=${DELIVERY_DEMO_PASSWORD:Group5-Demo-2026!}
